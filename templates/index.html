<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nutrition Advisor</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h1 id="heading">Welcome! Check Your Physical Appearance</h1>
        
        <!-- Step 1 -->
        <form id="step1-form">
            <label for="height">Height (ft.inches, e.g., 5.9):</label>
            <input type="number" id="height" name="height" step="0.01" min="4.0" max="7.0" required>
            <br>
            
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" min="30" max="200" required>
            <br>
            
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required> Male
            <input type="radio" id="female" name="gender" value="female" required> Female
            <br>
            
            <button type="submit" id="step1-submit" disabled>Submit</button>
        </form>
        
        <!-- Step 2 -->
        <form id="step2-form" style="display:none;">
            <h2>Select Your Budget Preferences</h2>
            <input type="radio" id="high" name="budget" value="High"> High
            <input type="radio" id="medium" name="budget" value="Medium"> Medium
            <input type="radio" id="low" name="budget" value="Low"> Low
            <br>
            <button type="submit" id="step2-submit" disabled>Submit</button>
        </form>
        
        <!-- Step 3 -->
        <form id="step3-form" style="display:none;">
            <h2>Select What You Prefer to Eat</h2>
            <label>Protein:</label>
            <div id="protein-container"></div>
            <br>
            <label>Carbs:</label>
            <div id="carbs-container"></div>
            <br>
            <label>Fibre:</label>
            <div id="fibre-container"></div>
            <br>
            <button type="submit" id="step3-submit">Get Meal Plan</button>
        </form>
        
        <!-- Result -->
        <div id="result" style="display:none;">
            <h2>Final Meal Plan</h2>
            <div id="bmi-result"></div>
            <div id="meal-plan"></div>
        </div>
    </div>

    <script src="{{url_for('static',filename='script.js')}}"></script>
</body>
</html>
